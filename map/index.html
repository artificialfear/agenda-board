<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Music Around the World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy: #141c30; --navy2: #1f2a44; --gold: #c9a227; --ink: #fff; --soft: #c9d0de; --ocean: #0d3b66;
    --na: #ef6c6c; --sa: #f2a65a; --eu: #6fa8ff; --af: #f4d35e; --as: #5ed39b; --oc: #c792ea; --ru: #4fc3c7; --an: #dfe7ef;
    --born: #7dd3fc; --work: #f9a8d4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--navy); color: var(--ink); overflow: hidden;
    font-family: "Segoe UI", Roboto, Arial, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
  button { font: inherit; cursor: pointer; }
  .osw { font-family: "Oswald", "Arial Narrow", Arial, sans-serif; letter-spacing: .04em; }

  /* ---------- top bar ---------- */
  #top { position: absolute; left: 0; right: 0; top: 0; height: 64px; display: flex; align-items: center; gap: 14px;
    padding: 0 14px; background: linear-gradient(#141c30, rgba(20,28,48,.92)); z-index: 5; border-bottom: 2px solid var(--gold); }
  #top h1 { margin: 0; font: 700 26px "Oswald", "Arial Narrow", Arial, sans-serif; color: var(--gold); white-space: nowrap; letter-spacing: .05em; }
  .tabs { display: flex; gap: 6px; }
  .tab { background: var(--navy2); color: var(--soft); border: 2px solid #34405f; border-radius: 999px; padding: 7px 14px;
    font: 600 17px "Oswald", "Arial Narrow", Arial, sans-serif; letter-spacing: .04em; white-space: nowrap; }
  .tab.on { background: var(--gold); color: var(--navy); border-color: var(--gold); }
  #searchWrap { position: relative; flex: 1; min-width: 160px; max-width: 520px; margin-left: auto; }
  #search { width: 100%; padding: 10px 14px 10px 38px; border-radius: 999px; border: 2px solid #34405f; background: #0f1626;
    color: #fff; font-size: 17px; outline: none; }
  #search:focus { border-color: var(--gold); }
  #searchWrap::before { content: "🔎"; position: absolute; left: 13px; top: 50%; transform: translateY(-50%); font-size: 15px; }
  #results { position: absolute; top: 48px; left: 0; right: 0; background: #0f1626; border: 2px solid var(--gold); border-radius: 12px;
    max-height: 60vh; overflow-y: auto; display: none; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  #results.open { display: block; }
  #results button { display: flex; width: 100%; gap: 10px; align-items: baseline; text-align: left; background: none; border: 0;
    border-bottom: 1px solid #22304d; color: #fff; padding: 10px 14px; font-size: 17px; }
  #results button:hover, #results button:focus { background: #1b2742; outline: none; }
  #results .k { color: var(--gold); font: 600 13px "Oswald", Arial, sans-serif; letter-spacing: .06em; min-width: 76px; text-transform: uppercase; }
  #results .s { color: var(--soft); font-size: 14px; margin-left: auto; }
  #close { background: var(--gold); color: var(--navy); border: 0; border-radius: 999px; padding: 9px 18px;
    font: 600 18px "Oswald", "Arial Narrow", Arial, sans-serif; letter-spacing: .04em; display: none; }
  body.embedded #close { display: block; }

  /* ---------- map ---------- */
  #mapBox { position: absolute; left: 0; right: 0; top: 64px; bottom: 0; background: radial-gradient(ellipse at 50% 40%, #155089 0%, #0d3b66 55%, #0a2f52 100%); }
  body.timeline #mapBox { bottom: 25vh; }
  svg#map { width: 100%; height: 100%; display: block; touch-action: none; }
  .sphere { fill: none; stroke: rgba(255,255,255,.18); stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
  .grat { fill: none; stroke: rgba(255,255,255,.07); stroke-width: 1px; vector-effect: non-scaling-stroke; }
  .land { stroke: #0d3b66; stroke-width: .7px; vector-effect: non-scaling-stroke; cursor: pointer; transition: filter .2s; }
  .land:hover { filter: brightness(1.15); }
  .land.music { stroke: var(--gold); stroke-width: 1.6px; }
  .land.sel { filter: brightness(1.3) saturate(1.2); stroke: #fff; stroke-width: 2.6px; }
  .land.dim { opacity: .45; }
  .arc { fill: none; stroke: var(--gold); stroke-width: 2.5px; stroke-dasharray: 7 6; vector-effect: non-scaling-stroke;
    animation: dash 1.2s linear infinite; }
  .arc.cw { stroke: var(--born); }
  @keyframes dash { to { stroke-dashoffset: -26; } }
  .mk { cursor: pointer; }
  .mk text { pointer-events: none; }
  .badge circle { fill: var(--gold); stroke: var(--navy); stroke-width: 2px; }
  .badge text { fill: var(--navy); font: 700 13px "Oswald", Arial, sans-serif; text-anchor: middle; dominant-baseline: central; }
  .home path { fill: var(--gold); stroke: #fff; stroke-width: 1.5px; }
  .home text, .lbl { fill: #fff; font: 600 14px "Oswald", Arial, sans-serif; letter-spacing: .03em; paint-order: stroke;
    stroke: rgba(10,20,40,.85); stroke-width: 4px; stroke-linejoin: round; }
  .pin circle { stroke: #fff; stroke-width: 2px; }
  .pin.song circle { fill: var(--gold); }
  .pin.born circle { fill: var(--born); }
  .pin.worked circle { fill: var(--work); }
  .pin.also circle { fill: #fff; }
  .pin text.g { fill: var(--navy); font: 700 13px Arial, sans-serif; text-anchor: middle; dominant-baseline: central; }
  .inst text.e { font-size: 26px; text-anchor: middle; dominant-baseline: central; }
  .inst circle { fill: rgba(20,28,48,.85); stroke: var(--gold); stroke-width: 2px; }
  .inst.sel circle { fill: var(--gold); }

  /* ---------- map buttons ---------- */
  #zoomBtns { position: absolute; left: 12px; bottom: 14px; display: flex; flex-direction: column; gap: 8px; z-index: 3; }
  body.timeline #zoomBtns { bottom: calc(25vh + 14px); }
  #zoomBtns button { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--gold); background: var(--navy2);
    color: var(--gold); font: 700 26px Arial, sans-serif; box-shadow: 0 4px 12px rgba(0,0,0,.4); }
  #legend { position: absolute; left: 76px; bottom: 14px; z-index: 3; display: flex; flex-wrap: wrap; gap: 6px 12px; max-width: 60vw;
    background: rgba(20,28,48,.82); border: 1px solid #34405f; border-radius: 12px; padding: 8px 12px; font-size: 13px; color: var(--soft); }
  body.timeline #legend { bottom: calc(25vh + 14px); }
  #legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  #legend b { color: var(--gold); }

  /* ---------- card ---------- */
  #card { position: absolute; top: 76px; right: 12px; width: min(480px, 40vw); max-height: calc(100% - 92px); overflow-y: auto; z-index: 4;
    background: rgba(20,28,48,.96); border: 2px solid var(--gold); border-radius: 18px; padding: 18px 20px 20px;
    box-shadow: 0 12px 40px rgba(0,0,0,.55); transform: translateX(calc(100% + 24px)); transition: transform .3s ease; }
  body.timeline #card { max-height: calc(75vh - 92px); }
  #card.open { transform: none; }
  #cardX { position: sticky; top: 0; float: right; margin: -6px -8px 0 8px; width: 40px; height: 40px; border-radius: 50%;
    border: 0; background: #2a3657; color: #fff; font-size: 20px; }
  .c-kicker { color: var(--gold); font: 600 14px "Oswald", Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
  .c-title { font: 700 32px/1.15 "Oswald", "Arial Narrow", Arial, sans-serif; margin: 4px 0 8px; letter-spacing: .02em; }
  .c-flag { font-size: 40px; line-height: 1; margin-right: 8px; vertical-align: -4px; }
  .c-sub { color: var(--soft); font-size: 17px; margin-bottom: 10px; }
  .c-row { margin: 12px 0; font-size: 19px; line-height: 1.4; }
  .c-row .h { display: block; color: var(--gold); font: 600 13px "Oswald", Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 2px; }
  .c-hello { font: 600 26px "Oswald", Arial, sans-serif; color: #fff; }
  .c-miles { margin-top: 14px; padding: 10px 12px; border-radius: 12px; background: #0f1626; font-size: 17px; color: var(--soft); }
  .c-miles b { color: var(--gold); font: 700 22px "Oswald", Arial, sans-serif; }
  .c-list { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .c-list button { text-align: left; background: #0f1626; border: 1px solid #2c3a5c; color: #fff; border-radius: 10px; padding: 9px 12px; font-size: 17px; }
  .c-list button small { color: var(--soft); margin-left: 6px; }
  .c-list button .n { color: var(--gold); font: 600 15px "Oswald", Arial, sans-serif; margin-right: 8px; }
  .c-chip { display: inline-block; background: #0f1626; border: 1px solid #2c3a5c; color: #fff; border-radius: 999px; padding: 6px 12px;
    font-size: 16px; margin: 4px 6px 0 0; }
  .c-chip.link { cursor: pointer; border-color: var(--gold); }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: 0; border: 2px solid #fff; }
  .c-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .c-btns button { background: var(--gold); color: var(--navy); border: 0; border-radius: 999px; padding: 10px 18px; font: 600 17px "Oswald", Arial, sans-serif; letter-spacing: .04em; }
  .c-btns button.ghost { background: transparent; color: var(--gold); border: 2px solid var(--gold); }

  /* ---------- timeline ---------- */
  #timeline { position: absolute; left: 0; right: 0; bottom: 0; height: 25vh; background: #0f1626; border-top: 2px solid var(--gold); display: none; z-index: 3; }
  body.timeline #timeline { display: block; }
  #timeline svg { width: 100%; height: 100%; display: block; }
  .era rect { opacity: .9; }
  .era text { fill: var(--navy); font: 700 15px "Oswald", Arial, sans-serif; letter-spacing: .04em; text-anchor: middle; }
  .tl-c { cursor: pointer; }
  .tl-c circle { fill: var(--gold); stroke: #fff; stroke-width: 2px; }
  .tl-c.sel circle { fill: #fff; stroke: var(--gold); stroke-width: 4px; }
  .tl-c text { fill: #fff; font: 600 14px "Oswald", Arial, sans-serif; text-anchor: middle; }
  .tl-c line { stroke: #5a6788; stroke-width: 1.5px; }
  .tl-axis text { fill: var(--soft); font: 12px Arial, sans-serif; text-anchor: middle; }

  /* ---------- mystery ---------- */
  #mystery { position: absolute; top: 76px; left: 12px; width: min(520px, 46vw); z-index: 4; display: none;
    background: rgba(20,28,48,.96); border: 2px solid var(--gold); border-radius: 18px; padding: 18px 20px 20px; box-shadow: 0 12px 40px rgba(0,0,0,.55); }
  body.mystery #mystery { display: block; }
  #mystery h2 { margin: 0 0 6px; font: 700 30px "Oswald", Arial, sans-serif; color: var(--gold); letter-spacing: .04em; }
  #mClues { margin: 0; padding: 0; list-style: none; counter-reset: c; }
  #mClues li { counter-increment: c; font-size: 21px; line-height: 1.4; margin: 10px 0; padding-left: 44px; position: relative; }
  #mClues li::before { content: counter(c); position: absolute; left: 0; top: 0; width: 32px; height: 32px; border-radius: 50%; background: var(--gold);
    color: var(--navy); font: 700 18px/32px "Oswald", Arial, sans-serif; text-align: center; }
  #mClues .lab { color: var(--soft); font-size: 15px; display: block; }
  #mAnswer { font: 700 34px "Oswald", Arial, sans-serif; color: #fff; margin-top: 10px; display: none; }
  #mAnswer.on { display: block; }

  /* ---------- instruments list ---------- */
  #instPanel { position: absolute; top: 76px; left: 12px; width: 250px; z-index: 4; display: none; background: rgba(20,28,48,.94);
    border: 2px solid var(--gold); border-radius: 16px; padding: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  body.instruments #instPanel { display: block; }
  .ip-h { color: var(--gold); font: 600 14px "Oswald", Arial, sans-serif; letter-spacing: .06em; margin-bottom: 8px; }
  #instList { display: flex; flex-direction: column; gap: 5px; }
  #instList button { text-align: left; background: #0f1626; color: #fff; border: 1px solid #2c3a5c; border-radius: 10px; padding: 7px 10px; font-size: 16px; }
  #instList button.on { background: var(--gold); color: var(--navy); border-color: var(--gold); font-weight: 600; }
  @media (max-height: 820px) { #instList button { padding: 4px 9px; font-size: 14px; } }

  /* ---------- video ---------- */
  #video { position: absolute; inset: 0; background: rgba(5,10,20,.85); display: none; align-items: center; justify-content: center; z-index: 9; }
  #video.open { display: flex; }
  #video .v-box { width: min(1100px, 92vw); aspect-ratio: 16 / 9; background: #000; border: 3px solid var(--gold); border-radius: 12px; overflow: hidden; }
  #video iframe { width: 100%; height: 100%; border: 0; }
  #videoX { position: absolute; top: 18px; right: 18px; background: var(--gold); color: var(--navy); border: 0; border-radius: 999px; padding: 10px 20px;
    font: 600 20px "Oswald", Arial, sans-serif; }

  #msg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--soft); font-size: 22px; z-index: 2; }
  @media (max-width: 900px) {
    #top { height: auto; flex-wrap: wrap; padding: 8px 10px; gap: 8px; }
    #top h1 { font-size: 20px; }
    #mapBox { top: 112px; }
    #card { top: auto; bottom: 0; right: 0; left: 0; width: auto; max-height: 55vh; border-radius: 18px 18px 0 0; transform: translateY(105%); }
    #mystery { left: 8px; right: 8px; width: auto; top: 120px; }
    .tab { font-size: 15px; padding: 6px 10px; }
  }
</style>
</head>
<body>
<div id="top">
  <h1>🌍 MUSIC AROUND THE WORLD</h1>
  <div class="tabs" role="tablist">
    <button class="tab on" data-mode="map">🗺 Songs</button>
    <button class="tab" data-mode="instruments">🎺 Instruments</button>
    <button class="tab" data-mode="timeline">🕰 Timeline</button>
    <button class="tab" data-mode="mystery">❓ Mystery Country</button>
  </div>
  <div id="searchWrap"><input id="search" type="search" placeholder="Song, number, composer or country…" autocomplete="off" aria-label="Search"><div id="results" role="listbox"></div></div>
  <button id="close">✕ Close</button>
</div>
<div id="mapBox"><svg id="map" aria-label="World map"></svg><div id="msg">Loading the map…</div></div>
<div id="zoomBtns"><button id="zIn" aria-label="Zoom in">+</button><button id="zOut" aria-label="Zoom out">−</button><button id="zHome" aria-label="Whole world">⌂</button></div>
<div id="legend"></div>
<div id="card" aria-live="polite"><button id="cardX" aria-label="Close card">✕</button><div id="cardBody"></div></div>
<div id="timeline"><svg id="tl"></svg></div>
<div id="instPanel"><div class="ip-h">🎺 WHERE OUR INSTRUMENTS CAME FROM</div><div id="instList"></div></div>
<div id="mystery">
  <h2>❓ MYSTERY COUNTRY</h2>
  <ol id="mClues"></ol>
  <div id="mAnswer"></div>
  <div class="c-btns"><button id="mNext">Next clue</button><button id="mReveal" class="ghost">Reveal</button><button id="mNew" class="ghost">New country</button></div>
</div>
<div id="video"><button id="videoX">✕ Close</button><div class="v-box"><iframe id="videoFrame" allow="autoplay; encrypted-media" allowfullscreen title="Listen"></iframe></div></div>

<script src="d3.min.js"></script>
<script src="topojson-client.min.js"></script>
<script>
(function () {
  "use strict";
  var EMBED = window.parent && window.parent !== window;
  if (EMBED) document.body.classList.add("embedded");

  // ---------------- helpers ----------------
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function norm(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[“”"'’.,!?()]/g, "").replace(/\s+/g, " ").trim(); }
  var MILES = 3958.8;
  function miles(a, b) { return Math.round(d3.geoDistance([a.lon, a.lat], [b.lon, b.lat]) * MILES); }
  function fmt(n) { return n.toLocaleString("en-US"); }

  // Country names people type → the map's names
  var ALIAS = { "usa": "United States of America", "us": "United States of America", "united states": "United States of America", "america": "United States of America",
    "uk": "United Kingdom", "england": "United Kingdom", "scotland": "United Kingdom", "wales": "United Kingdom", "great britain": "United Kingdom",
    "britain": "United Kingdom", "northern ireland": "United Kingdom", "czech republic": "Czechia", "holland": "Netherlands", "korea": "South Korea",
    "trinidad": "Trinidad and Tobago", "the netherlands": "Netherlands" };
  function countryName(s) { var k = norm(s); return ALIAS[k] || s; }

  // Continent colors (every country, from where its middle is; a few by name)
  var CONT = { NA: { c: "var(--na)", n: "North America" }, SA: { c: "var(--sa)", n: "South America" }, EU: { c: "var(--eu)", n: "Europe" },
    AF: { c: "var(--af)", n: "Africa" }, AS: { c: "var(--as)", n: "Asia" }, OC: { c: "var(--oc)", n: "Oceania" },
    RU: { c: "var(--ru)", n: "Europe & Asia" }, AN: { c: "var(--an)", n: "Antarctica" } };
  var BYNAME = { "Russia": "RU", "Turkey": "RU", "Kazakhstan": "AS", "Greenland": "NA", "Trinidad and Tobago": "NA", "Panama": "NA",
    "Cyprus": "AS", "N. Cyprus": "AS", "Georgia": "AS", "Armenia": "AS", "Azerbaijan": "AS", "Egypt": "AF", "Libya": "AF", "Tunisia": "AF",
    "Algeria": "AF", "Morocco": "AF", "W. Sahara": "AF", "Papua New Guinea": "OC", "Timor-Leste": "AS", "Indonesia": "AS", "Fr. S. Antarctic Lands": "AN",
    "Antarctica": "AN", "Falkland Is.": "SA", "Iceland": "EU" };
  function continent(f) {
    var n = f.properties.name; if (BYNAME[n]) return BYNAME[n];
    var c = d3.geoCentroid(f), lon = c[0], lat = c[1];
    if (lon < -25) return (lat < 12.5 && lon > -80) || lat < 0 ? "SA" : "NA";
    if (lat < -10 && lon > 110) return "OC";
    if (lon > 160 || lon < -150) return "OC";
    if (lon < 60 && lat > 35 && !(lon > 35 && lat < 42)) return "EU";
    if (lon >= 34 && lat > 12 && lon < 64) return "AS";
    if (lon < 52 && lat < 37) return "AF";
    return "AS";
  }
  // Where a country's ♪ badge sits (a few countries' middles are far from where people live)
  var CENTER = { "United States of America": [-98.5, 39.5], "Russia": [44, 56.5], "Canada": [-100, 56], "France": [2.4, 46.6],
    "United Kingdom": [-2.2, 53.6], "Norway": [9, 61.5], "Chile": [-71, -33], "Netherlands": [5.3, 52.2], "Japan": [138.5, 36.4],
    "China": [104, 34], "Italy": [12.6, 42.8], "Australia": [134, -25], "Brazil": [-51, -10], "Indonesia": [117, -2], "Denmark": [9.5, 56] };

  // ---------------- data ----------------
  var D = null, BYC = {}, SONGS = [], COMP = {}, COUNTRIES = {}, INST = [], HOME = null;

  function loadData() {
    return fetch("data.json", { cache: "no-cache" }).then(function (r) { return r.json(); }).then(function (base) {
      D = base;
      return sheetData().then(function (sheet) { if (sheet) merge(sheet); }, function () {});
    });
  }
  // The "Map Songs" / "Map Composers" / "Map Countries" tabs (Content Pool sheet) win when they have rows.
  function sheetData() {
    var s = {}; try { s = JSON.parse(localStorage.getItem("agendaBoard.settings") || "{}"); } catch (e) {}
    var url = s.closingUrl; if (!url) return Promise.resolve(null);
    var u; try { u = new URL(url); } catch (e) { return Promise.resolve(null); }
    u.searchParams.set("a", "map");
    return Promise.race([
      fetch(u.toString()).then(function (r) { return r.json(); }).then(function (j) { return j && j.ok ? j : null; }),
      new Promise(function (res) { setTimeout(function () { res(null); }, 8000); })
    ]);
  }
  function num(v) { var n = parseFloat(v); return isFinite(n) ? n : null; }
  function merge(j) {
    D.__sheet = true;
    var oldAlso = {}; D.songs.forEach(function (s) { if (s.also) oldAlso[norm(s.title)] = s.also; });
    if (j.songs && j.songs.length) {
      D.songs = j.songs.filter(function (r) { return r["Title"] && !/^(no|hide|n)$/i.test(String(r["Show"] || "").trim()); }).map(function (r) {
        var s = { n: String(r["Book #"] || ""), title: String(r["Title"]), label: String(r["Book says"] || ""), country: countryName(r["Country"]),
          composer: String(r["Composer"] || ""), fact: String(r["Fun fact"] || ""), yt: String(r["YouTube link"] || "") };
        var lat = num(r["Lat"]), lon = num(r["Lon"]);
        if (r["Place"]) s.place = String(r["Place"]);
        if (lat != null && lon != null) { s.lat = lat; s.lon = lon; }
        if (oldAlso[norm(s.title)]) s.also = oldAlso[norm(s.title)];
        return s;
      });
    }
    (j.composers || []).forEach(function (r) {
      var name = String(r["Composer"] || "").trim(); if (!name) return;
      var c = D.composers[name] || {};
      function place(p, la, lo) { var a = num(r[la]), b = num(r[lo]); return r[p] && a != null && b != null ? { place: String(r[p]), lat: a, lon: b } : null; }
      c.years = String(r["Years"] || c.years || ""); c.born = num(r["Born year"]) || c.born; c.era = String(r["Era"] || c.era || "");
      c.country = countryName(r["Country"] || c.country || ""); c.fact = String(r["Fun fact"] || c.fact || "");
      var b = place("Born place", "Born lat", "Born lon"); if (b) c.birth = b;
      var w = place("Worked place", "Worked lat", "Worked lon"); if (w) c.worked = w;
      D.composers[name] = c;
    });
    (j.countries || []).forEach(function (r) {
      var name = countryName(String(r["Country"] || "").trim()); if (!name) return;
      var c = D.countries[name] || {};

          a += 1.1; r = 16 + a * 7; var o = xy(it.lon, it.lat); p = [o[0] + Math.cos(a) * r, o[1] + Math.sin(a) * r];

  // Zoom so a set of [lon,lat] points / a country fits beside the card
  function fit(bounds, maxK) {
    var cardW = $("card").classList.contains("open") && window.innerWidth > 900 ? $("card").offsetWidth + 24 : 0;
    var leftW = window.innerWidth <= 900 ? 0 : mode === "mystery" ? $("mystery").offsetWidth + 24 : mode === "instruments" ? $("instPanel").offsetWidth + 24 : 0;
    var x0 = bounds[0][0], y0 = bounds[0][1], x1 = bounds[1][0], y1 = bounds[1][1];

    var cx = leftW + (W - cardW - leftW) / 2, cy = H / 2;
    var t = d3.zoomIdentity.translate(cx, cy).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
    svg.transition().duration(900).call(zoom.transform, t);

    if (mode === "map" || mode === "timeline") h += '<span><b>♪</b> = pieces in our book</span><span><span class="dot" style="background:var(--born)"></span>born</span><span><span class="dot" style="background:var(--work)"></span>worked</span>';
    if (mode === "instruments") h += '<span><b>Tap an instrument</b> to see where it was invented</span>';
    $("legend").innerHTML = h;
  }

  function paintInstList() {
    $("instList").innerHTML = INST.map(function (it, i) { return '<button data-i="' + i + '"' + (selInst === it ? ' class="on"' : "") + '>' + it.emoji + " " + esc(it.name) + '</button>'; }).join("");
  }
  $("instList").addEventListener("click", function (e) { var b = e.target.closest("[data-i]"); if (b) { pickInst(INST[+b.getAttribute("data-i")]); paintInstList(); } });

  // ---------------- timeline ----------------
  function drawTimeline() {
    var el = $("tl"), r = el.getBoundingClientRect(), w = r.width, h = r.height;
    var s = d3.select(el); s.selectAll("*").remove();
    var x = d3.scaleLinear().domain([1450, 2030]).range([30, w - 30]);
    var bandY = Math.round(h * 0.42), bandH = 30;
    var col = { "Renaissance": "#c792ea", "Baroque": "#f4d35e", "Classical": "#6fa8ff", "Romantic": "#ef6c6c", "20th Century": "#5ed39b", "Today": "#f2a65a" };
    var eg = s.append("g");
    D.eras.forEach(function (e) {
      var g = eg.append("g").attr("class", "era");
      g.append("rect").attr("x", x(Math.max(1450, e.from))).attr("y", bandY).attr("width", x(e.to) - x(Math.max(1450, e.from))).attr("height", bandH).attr("fill", col[e.name] || "#888");
      g.append("text").attr("x", (x(Math.max(1450, e.from)) + x(e.to)) / 2).attr("y", bandY + 21).text(e.name.toUpperCase());
    });
    var ax = s.append("g").attr("class", "tl-axis");
    [1500, 1600, 1700, 1800, 1900, 2000].forEach(function (y) { ax.append("text").attr("x", x(y)).attr("y", bandY + bandH + 18).text(y); });
    var names = Object.keys(COMP).filter(function (k) { return COMP[k].born; }).sort(function (a, b) { return COMP[a].born - COMP[b].born; });
    // four rows (two above the eras, two below); each name goes in the first row where it fits
    var ROWS = [{ dot: bandY - 16, lab: bandY - 28 }, { dot: bandY + bandH + 16, lab: bandY + bandH + 40 },
                { dot: bandY - 54, lab: bandY - 66 }, { dot: bandY + bandH + 54, lab: bandY + bandH + 78 }];
    var ends = [-1e9, -1e9, -1e9, -1e9];
    names.forEach(function (n) {
      var c = COMP[n], cx = x(Math.max(1450, c.born));
      var short = n.replace(/^(Johann Sebastian|Wolfgang Amadeus|Ludwig van|George Frideric|Peter Ilyich|John Philip|Jean-Jacques|Johann|Jacques|Gustav|Percy|Stephen|Jeremiah|Tielman|Bruce|Anne|David|Ryan|Erin A\.|J\. S\.)\s+/, "");
      var half = short.length * 4.4 + 8, row = 0;
      while (row < 3 && ends[row] > cx - half) row++;
      ends[row] = cx + half;
      var R = ROWS[row], above = R.dot < bandY;
      var g = s.append("g").attr("class", "tl-c").attr("data-c", n).on("click", function () { pickComposer(n); });
      g.append("line").attr("x1", cx).attr("x2", cx).attr("y1", above ? R.dot : bandY + bandH).attr("y2", above ? bandY : R.dot);
      g.append("circle").attr("cx", cx).attr("cy", R.dot).attr("r", 8);
      g.append("text").attr("x", cx).attr("y", R.lab).text(short);
      g.append("title").text(n + " (" + c.years + ")");
    });
    s.append("text").attr("x", 30).attr("y", 20).attr("fill", "#c9a227").attr("font-family", "Oswald, Arial").attr("font-size", 15).attr("letter-spacing", ".06em")
      .text("COMPOSERS IN OUR BOOK · by the year they were born · tap one to see where they lived");
  }

  // ---------------- mystery country ----------------
  var DEMONYM = { "United States of America": ["American", "America", "U.S.", "USA"], "United Kingdom": ["British", "English", "Scottish", "Welsh", "Britain", "England", "Scotland", "Wales"],
    "Germany": ["German"], "Austria": ["Austrian"], "France": ["French"], "Italy": ["Italian"], "Spain": ["Spanish"], "Russia": ["Russian"], "Japan": ["Japanese"],
    "China": ["Chinese"], "Mexico": ["Mexican"], "Puerto Rico": ["Puerto Rican"], "Jamaica": ["Jamaican"], "Trinidad and Tobago": ["Trinidadian", "Trinidad", "Tobago"],
    "Canada": ["Canadian"], "Australia": ["Australian", "Aboriginal Australian"], "Sweden": ["Swedish"], "Brazil": ["Brazilian"], "South Africa": ["South African"],
    "Belgium": ["Belgian"], "Finland": ["Finnish"], "Czechia": ["Czech"], "Switzerland": ["Swiss"], "Guatemala": ["Guatemalan"], "Turkey": ["Turkish"],
    "Cuba": ["Cuban"], "Argentina": ["Argentine", "Argentinian"], "Indonesia": ["Indonesian"], "India": ["Indian"], "Egypt": ["Egyptian"], "Kenya": ["Kenyan"],
    "Ghana": ["Ghanaian"], "Mali": ["Malian"], "New Zealand": ["Māori", "Maori", "Kiwi"], "Norway": ["Norwegian"], "Iceland": ["Icelandic", "Icelanders"], "Netherlands": ["Dutch"],
    "Portugal": ["Portuguese"], "Greece": ["Greek"], "Poland": ["Polish"], "Hungary": ["Hungarian"], "South Korea": ["Korean", "Korea"], "Peru": ["Peruvian"],
    "Mongolia": ["Mongolian"], "Nepal": ["Nepalese", "Nepali"], "Madagascar": ["Malagasy"], "Venezuela": ["Venezuelan"], "Colombia": ["Colombian"],
    "Philippines": ["Filipino", "Filipinos"], "Thailand": ["Thai"], "Vietnam": ["Vietnamese"], "Nigeria": ["Nigerian"], "Morocco": ["Moroccan"],
    "Ethiopia": ["Ethiopian"], "Chile": ["Chilean"], "Ukraine": ["Ukrainian"], "Tanzania": ["Tanzanian"], "Ireland": ["Irish"] };
  function redact(text, name) {
    var words = [name].concat(DEMONYM[name] || []).sort(function (a, b) { return b.length - a.length; });
    var out = String(text || "");
    words.forEach(function (w) {
      var re = new RegExp("(^|[^\\w])" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?![\\w])", "gi");
      out = out.replace(re, "$1▢▢▢");
    });
    return out;
  }
  var mPool = [], mOrder = [];
  function newMystery() {
    if (!mPool.length) mPool = Object.keys(COUNTRIES).filter(function (n) { var c = COUNTRIES[n]; return byName[n] && c.known && c.fact && c.hello; });
    if (!mOrder.length) mOrder = d3.shuffle(mPool.slice());
    var name = mOrder.pop(), c = COUNTRIES[name];
    var clues = [
      { lab: "Continent", t: c.cont || CONT[byName[name].cont].n },
      { lab: "People here say hello like this", t: c.hello },
      { lab: "Known for", t: redact(c.known, name) },
      { lab: c.music ? "Music" : "Fun fact", t: redact(c.music || c.fact, name) }
    ];
    mysteryC = { name: name, clues: clues, shown: 1, revealed: false };
    selCountry = null; closeCard(); paintMystery(); home();
  }
  function paintMystery() {
    var m = mysteryC; if (!m) return;
    $("mClues").innerHTML = m.clues.slice(0, m.shown).map(function (c) { return '<li><span class="lab">' + esc(c.lab) + '</span>' + esc(c.t) + '</li>'; }).join("");
    $("mNext").style.display = m.shown < m.clues.length && !m.revealed ? "" : "none";
    $("mAnswer").classList.toggle("on", m.revealed);
    $("mAnswer").innerHTML = m.revealed ? ((COUNTRIES[m.name] || {}).flag || "") + " " + esc(m.name) : "";
    $("mReveal").style.display = m.revealed ? "none" : "";
  }
  $("mNext").onclick = function () { if (mysteryC) { mysteryC.shown++; paintMystery(); } };
  $("mReveal").onclick = function () {
    if (!mysteryC) return;
    mysteryC.revealed = true; mysteryC.shown = mysteryC.clues.length; paintMystery();
    selCountry = mysteryC.name; restyle(); fitCountry(mysteryC.name);
  };
  $("mNew").onclick = newMystery;

  // ---------------- buttons, resize, close ----------------
  $("zIn").onclick = function () { svg.transition().duration(300).call(zoom.scaleBy, 1.6); };
  $("zOut").onclick = function () { svg.transition().duration(300).call(zoom.scaleBy, 1 / 1.6); };
  $("zHome").onclick = home;
  $("close").onclick = function () { try { window.parent.postMessage({ agendaMap: "close" }, "*"); } catch (e) {} };
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && document.activeElement !== $("search")) {
      if ($("video").classList.contains("open")) $("videoX").click();
      else if ($("card").classList.contains("open")) closeCard();
      else $("close").click();
    }
  });
  var rt = 0;
  window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { var t = T; size(); draw(); if (mode === "timeline") drawTimeline(); svg.call(zoom.transform, t); }, 150); });
  // the board can ask the map to start fresh each time it opens
  window.addEventListener("message", function (e) { if (e.data && e.data.agendaMap === "opened") { if ($("video").classList.contains("open")) $("videoX").click(); } });

  // ---------------- start ----------------
  Promise.all([fetch("countries-110m.json").then(function (r) { return r.json(); }), loadData()]).then(function (two) {
    world = two[0];
    features = topojson.feature(world, world.objects.countries).features;
    features.forEach(function (f) { f.cont = continent(f); byName[f.properties.name] = f; });
    HOME = D.home; COMP = D.composers; COUNTRIES = D.countries; INST = D.instruments;
    SONGS = D.songs.filter(function (s) { return byName[s.country]; });
    BYC = {}; SONGS.forEach(function (s) { (BYC[s.country] = BYC[s.country] || []).push(s); });
    $("msg").style.display = "none";
    size(); svg.call(zoom).on("dblclick.zoom", null); draw(); legend();
    window.__map = { songs: SONGS, countries: COUNTRIES, composers: COMP, byName: byName, mode: function () { return mode; },
      pickSong: pickSong, pickCountry: pickCountry, pickComposer: pickComposer, setMode: setMode, mystery: function () { return mysteryC; },
      transform: function () { return T; }, sheet: D.__sheet || false };
    var q = new URLSearchParams(location.search).get("q"); if (q) { $("search").value = q; search(); }
  }).catch(function (e) { $("msg").textContent = "Couldn't load the map (" + (e && e.message || e) + ")."; });
})();
</script>
